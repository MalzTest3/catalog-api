name: Publish Preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: Catalog preview version
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-preview
  cancel-in-progress: false

jobs:
  publish:
    name: Publish preview release
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: write # create or update Release preview and upload receipt.txt
    steps:
      - name: Write preview receipt
        env:
          PREVIEW_CDN_TOKEN: ${{ secrets.PREVIEW_CDN_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-[a-z0-9]+)?$ ]]; then
            echo "version must look like 2026.09.21 or 2026.09.21-hardened"
            exit 1
          fi
          if [[ -z "$PREVIEW_CDN_TOKEN" ]]; then
            echo "missing PREVIEW_CDN_TOKEN"
            exit 1
          fi
          mkdir -p dist
          printf 'catalog-api preview %s\n' "$VERSION" > dist/receipt.txt
          printf 'cdn_upload=accepted\n' >> dist/receipt.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: preview
          name: catalog preview
          files: dist/receipt.txt
